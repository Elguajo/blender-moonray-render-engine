name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate repository state
        run: python3 scripts/validate_repo.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in scripts/linux/*.sh scripts/github/*.sh; do
            bash -n "$file"
          done

      - name: Compile Python scripts
        run: python3 -m compileall -q scripts
